name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Record pages for IndexNow
        run: >-
          python3 .github/scripts/indexnow.py snapshot
          --site-dir "_site${{ steps.pages.outputs.base_path }}"
          --site-url https://soumyak4.in
          --output indexnow/current.json
          --previous-output indexnow/deployed.json

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

      - name: Upload IndexNow snapshot
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-snapshot
          path: indexnow/*.json

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Notify IndexNow
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current snapshot
        uses: actions/download-artifact@v4
        with:
          name: indexnow-snapshot
          path: indexnow

      - name: Restore last submitted snapshot
        uses: actions/cache/restore@v4
        with:
          path: indexnow/previous.json
          key: indexnow-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-v1-${{ github.ref_name }}-

      - name: Submit new, updated, and deleted pages
        run: >-
          python3 .github/scripts/indexnow.py submit
          --current indexnow/current.json
          --previous indexnow/previous.json
          --fallback indexnow/deployed.json
          --key-file 5f14bc6a018745041eab9fa1cdc6dffd.txt

      # Save only after success, so a failed submission is retried next time.
      - name: Update submitted snapshot
        run: cp indexnow/current.json indexnow/previous.json

      - name: Save submitted snapshot
        uses: actions/cache/save@v4
        with:
          path: indexnow/previous.json
          key: indexnow-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
